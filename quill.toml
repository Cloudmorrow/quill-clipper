# Clipper: a video editor. The videos, photos and sounds in the drive are
# its material; a project lays pieces of them on video and audio tracks,
# cut, trimmed and moved, each as big as the picture or smaller over what is
# under it, with blurs that follow keyframes and a crop, and exports a new
# file to My Files › Clipper Exports. The editor is Cloudmorrow's
# timeline kit, drawn on every surface; the pictures and the export come from
# a service beside the server, with ffmpeg, which the install brings. See
# CLAUDE.md for the format and the loop.

[quill]
id = "clipper"
name = "Clipper"
version = "4.1.0"
summary = "A video editor for the videos and photos in your drive: drag clips and photos onto video and audio tracks, cut, trim and arrange them, put one small over another, blur what should not be seen, crop, and export."
category = "creative"
icon = "play"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"
code = "quill.py"
features = [
  "Every video, photo and sound in your drive is material, as tiles beside the picture: drag one onto a track where it should go, or tap it to put it at the playhead; another drive or share is chosen above them",
  "Edit this video, on a video in Media or Files (and Edit this sound on a sound), opens it under its own name, all of it on the first track; a photo is Retouch's",
  "Save, on a video opened so: over the video itself (the one before goes to the Trash) or as a new file beside it; the project then starts afresh on the saved video",
  "A real timeline: video and audio tracks, pieces cut, trimmed, split, moved and rearranged; a higher video track covers a lower one; a photo stays as long as you make it",
  "Make a clip or a photo smaller and put it anywhere in the picture, over what is under it: a box dragged on the viewer, or numbers typed",
  "Sound from every piece, mixed: mute one, or set its volume",
  "Blur a face, a number plate or a screen with keyframes: the box moves and resizes in a straight line between them, and moves with its piece",
  "Crop the whole picture",
  "A new project is the size you choose (1080p, 720p, 4K, vertical, square or your own), or its first clip's",
  "Export to MP4, WebM, MOV, GIF or sound-only M4A, as the project or at 1080p, 720p or 480p, into My Files › Clipper Exports",
  "The same editor on the web and the phone (live, with sound), in the terminal (real frames) and on the command line",
]

# The material and the exports are files in the person's drive.
[uses]
datamodels = ["file"]

# -- screens -------------------------------------------------------------------------
# The projects, and each one in the editor: Cloudmorrow's timeline kit
# (docs/TIMELINE.md in the core). The material is every video, photo and
# sound in My Files, and in any other drive chosen in the editor. Looking
# through the videos and photos is Media's: Clipper requires it, and adds
# Edit this video to a video or a photo there.
[[screens]]
id = "editor"
kit = "timeline"
label = "Clipper"
model = "clipper.project"
title = "name"
pieces = "clipper.piece"
effects = "clipper.effect"
media = { share = "my-files", within = "" }   # the whole drive, every folder
frames = "frames"
export = "export"
save = "save"

# -- actions -------------------------------------------------------------------------
# A video becomes a project with it on the first track: a button on a
# video's sheet — only a video's, by its name — so on one opened in Media or
# Files; a sound has its own. Nothing is asked: the project opens under the
# file's own name, and the file is not touched until it is saved over. A
# photo's button is Retouch's; photos still go on the tracks from the tiles.
[[actions]]
id = "edit-video"
label = "Edit this video"
on = "file"
only = { kind = "file", name = ["*.mp4", "*.mov", "*.m4v", "*.mkv", "*.webm", "*.avi", "*.mts", "*.m2ts", "*.3gp", "*.mpg", "*.mpeg", "*.ogv"] }
tone = "primary"
description = "Opens this video in Clipper, under its own name, all of it on the first video track; the video itself is not changed until you save over it."

[[actions]]
id = "edit-sound"
label = "Edit this sound"
on = "file"
only = { kind = "file", name = ["*.mp3", "*.m4a", "*.aac", "*.wav", "*.flac", "*.ogg", "*.oga", "*.opus", "*.wma", "*.aif", "*.aiff"] }
handler = "edit_video"
tone = "primary"
description = "Opens this sound in Clipper, under its own name, all of it on the first audio track."

# Save: rendered beside the server, and written over the video the project
# was started from (the one before goes to the Trash) or put beside it as
# a new file, in the kind its name says. The editor asks which and presses
# this with both answered; the project says how it goes.
[[actions]]
id = "save"
label = "Save"
on = "clipper.project"
tone = "primary"
description = "Saves the project over the video it was started from, or as a new file beside it, by its name's suffix: .mp4, .mov, .webm, .gif or .m4a."
[actions.fields]
overwrite = { kind = "bool", default = false, label = "Over the video", description = "Write over the video itself; the one before goes to the Trash" }
name = { kind = "string", description = "What to call the new file, suffix and all; the video's name when writing over it" }

# The export: rendered beside the server, and put in My Files › Clipper
# Exports, in any format and size. The project says how it goes.
[[actions]]
id = "export"
label = "Export"
on = "clipper.project"
tone = "primary"
description = "Renders the project to a new file in My Files › Clipper Exports."
[actions.fields]
format = { kind = "enum", values = ["mp4", "webm", "mov", "gif", "m4a"], labels = ["MP4 (H.264, AAC)", "WebM (VP9, Opus)", "MOV (H.264)", "GIF (no sound)", "M4A (sound only)"], default = "mp4", required = true }
size = { kind = "enum", values = ["project", "1080p", "720p", "480p"], labels = ["As the project", "1080p", "720p", "480p"], default = "project", required = true }
name = { kind = "string", description = "What to call the file; the project's name when left out" }

# Draw the screen again: the renderer works beside the server.
[[actions]]
id = "refresh"
label = "Refresh"
assistant = false

# -- the renderer ----------------------------------------------------------------------
# A program beside the server, with ffmpeg: it answers the frames API the
# editor draws its viewer from, fills in the lengths and sizes the kit
# leaves blank, and renders the exports people ask for. It works through the
# record API, as the administrator who installed Clipper.
[[services]]
id = "render"
command = ["python", "services/render.py"]
always = true

# The frames API: /api/q/clipper/frames/info, /source and /frame.
[[apis]]
id = "frames"
service = "render"
prefix = "frames"

# ffmpeg and ffprobe come with the install: the server fetches the catalog's
# static build for its own machine, checks it, and puts it first on the
# renderer's PATH. Nobody installs anything on the server by hand.
[requires]
runtimes = ["ffmpeg"]
# Media shows the videos (and the photos) in the drive; Clipper edits them.
# Installing Clipper installs Media first; Media needs nothing of Clipper.
quills = ["media"]
